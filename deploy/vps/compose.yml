# Production stack on the Contabo VPS (Ubuntu 24.04, Docker CE + compose plugin).
# Caddy terminates HTTPS on the host network and proxies to http://127.0.0.1:8000.
#
# Live copy: /srv/mars/compose.yml, next to .env, Caddyfile, db-roles.sql, secrets/, backups/
# and www/ (update.sh copies compose.yml, Caddyfile and db-roles.sql there from the repository
# clone /srv/mars/repo; www/ holds the web interface files Caddy serves, one directory per
# release). Runbook: deploy/README.md, "VPS (Contabo) + Caddy".
#
# The app image is built on the server from the clone and tagged with the commit
# (mars-rover-api:<sha>); update.sh writes the tag to APP_TAG in .env.
# Migrations are a separate step (update.sh): docker compose run --rm migrate
#
# Two database roles:
#   mars      owner of the schema; used by the db container, migrations (service `migrate`),
#             backups and restores. Its password lives ONLY in secrets/pg_owner_password.
#   mars_app  used by the running app: SELECT/INSERT/UPDATE/DELETE only (db-roles.sql).
#             Its password is APP_DB_PASSWORD in .env.
# The app container never sees the owner password.

name: mars

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # Pin the digest on install: set POSTGRES_IMAGE in .env (deploy/README.md, "Pin images").
    image: ${POSTGRES_IMAGE:-postgres:16.16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mars
      POSTGRES_DB: mars
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      # Read by db-roles.sql (psql \getenv) to create/refresh the mars_app role.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    secrets:
      - pg_owner_password
    # Sized for 12 GB RAM / 6 vCPU shared with the app (3 GB) and Caddy. shared_buffers is
    # 1/4 of the memory limit below; the rest is left to the OS page cache.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - max_parallel_workers_per_gather=2
      # Cap temporary files per session so one runaway query cannot fill the disk.
      - -c
      - temp_file_limit=2GB
    # Docker's default /dev/shm is 64 MB; parallel query workers allocate dynamic shared
    # memory there ("could not resize shared memory segment").
    shm_size: 512m
    mem_limit: 4g
    cpus: 4
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    # No published ports: only the app container reaches the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only: restore.sh / verify-backup.sh read dumps from here (pg_restore --jobs).
      # backup.sh streams pg_dump to a host file, so nothing is written here.
      - ./backups:/backups:ro
      # Runs only when the data volume is empty (first start): creates the mars_app role.
      # On an existing volume update.sh applies the same file (idempotent).
      - ./db-roles.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  app:
    image: mars-rover-api:${APP_TAG:?run update.sh (it sets APP_TAG in .env) or set APP_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Loopback only: Caddy on the host network is the only client.
    ports:
      - "127.0.0.1:8000:8000"
    # Optional settings (ADMIN_TOKEN, TELEGRAM_*, RATE_LIMIT_*, ...) come from .env as is;
    # a variable missing there is not passed at all, so the application default applies.
    # .env holds no owner database password (that is in secrets/pg_owner_password).
    env_file:
      - path: .env
        required: true
    # Fixed for this deployment; these override the same names in .env.
    environment:
      DATABASE_URL: postgresql+asyncpg://mars_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/mars
      ENVIRONMENT: prod
      # Peers whose X-Forwarded-For / X-Forwarded-Proto uvicorn trusts. Caddy (host network)
      # connects to 127.0.0.1:8000; Docker forwards that to the container, which (userland
      # proxy) sees the bridge gateway of the fixed subnet below. That is the host itself, so
      # no remote client can have this address. Not "*", no wide ranges: with a list uvicorn
      # takes the right-most untrusted X-Forwarded-For entry. If the rehearsal shows another
      # peer address in the app log, set FORWARDED_ALLOW_IPS in .env to exactly that address
      # (deploy/README.md, "Checks after a rollout").
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.1}
      # The single scheduler of the deployment. With more than one app replica set it to
      # "true" on ONE of them only (the advisory lock is a second line of defence, not a plan).
      # One-off containers (docker compose run --rm app python -m app.cli ...) do not start
      # the server, so they do not start a second scheduler.
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      # Server-wide ceiling: above this many open connections or requests in flight uvicorn
      # answers 503 "Service Unavailable" (text/plain, no Retry-After, no CORS headers) before
      # the application sees the request. Open connections count too, idle keep-alive ones
      # of Caddy included (closed by uvicorn after 5 s). Caddy does not cap its connections to
      # the app (a cap let one slow reader hold every slot, deploy/README.md, "Edge limits"),
      # so this is the ceiling for everything that reaches the app. The web interface files
      # do not count against it: Caddy serves them itself.
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-384}
    # Cache of converted Spirit/Opportunity full-size images (MER_IMAGE_CACHE_*, see .env).
    # Named volume, so that uid 10001 (user app) can write to it; it can be deleted at any
    # time (images are converted again on demand).
    volumes:
      - mer_images:/app/data/mer-images
    # The image is not written to at runtime: the only writable places are the cache volume
    # and /tmp. If something in a new release needs another path, the app fails with
    # "Read-only file system" in the log: add the path here (or drop read_only).
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 3g
    cpus: 4
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *logging

  # One-off: docker compose run --rm migrate (update.sh, restore.sh). Runs Alembic as the
  # schema owner `mars`; the password is read from the secret file inside the container, so it
  # appears neither in .env, nor in the process list, nor in the running app's environment.
  migrate:
    image: mars-rover-api:${APP_TAG:?run update.sh (it sets APP_TAG in .env) or set APP_TAG}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: prod
    secrets:
      - pg_owner_password
    entrypoint: ["sh", "-c"]
    command:
      - 'DATABASE_URL="postgresql+asyncpg://mars:$$(cat /run/secrets/pg_owner_password)@db:5432/mars" exec alembic upgrade head'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    # Pin the digest on install: set CADDY_IMAGE in .env (deploy/README.md, "Pin images").
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    # Host network: Caddy sees the real client address (IPv4 and IPv6) and reaches the app on
    # 127.0.0.1:8000. It listens on 80 and 443 of the host; ufw and the Contabo firewall
    # allow those. Its admin API listens on localhost:2019 only (used by `caddy reload`).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Web interface files: www/<tag>/ per release, www/current -> the active one (update.sh,
      # publish-frontend.sh). A directory, so a new release needs no Caddy restart. Created by
      # update.sh before the first start; without www/current/index.html the app serves the
      # interface itself.
      - ./www:/srv/www:ro
      # Certificates and the ACME account: keep this volume, losing it means re-issuing
      # (Let's Encrypt rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # 2g (was 512m): clients that send requests and read a little, then stop, hold about
    # 0.22-0.44 MB of Caddy memory per connection for static files and answers up to 190 KB, and
    # up to 1.4 MB for an 8 MB answer (stand measurements, deploy/README.md "Edge limits"). The
    # nftables ceiling of 1500 connections in total (limits.sh, CONN_MAX_ALL) is about 660 MB
    # at 0.44 MB and 2.1 GB only if every connection held an 8 MB answer, which the app's
    # per-address concurrency limits do not allow. GOMEMLIMIT is not set: most of that memory
    # is kernel socket buffers, which the Go limit does not see. Host budget: db 4g + app 3g +
    # caddy 2g = 9g of 12 GB.
    mem_limit: 2g
    pids_limit: 512
    logging: *logging

secrets:
  pg_owner_password:
    # 0644 inside a 0700 directory: the postgres (uid 70) and app (uid 10001) users in the
    # containers must be able to read it through the bind mount.
    file: ./secrets/pg_owner_password

# Fixed subnet: FORWARDED_ALLOW_IPS names its gateway, so it must not change by itself.
# 172.28.0.0/24 must not clash with other networks on the host (check: docker network ls,
# ip route); change both here and in FORWARDED_ALLOW_IPS if it does.
networks:
  default:
    name: mars_default
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

# Explicit names: they do not depend on the project name. The live volume with the database
# is mars_pgdata; do not rename the project (`mars`) or the volumes, otherwise Compose
# creates an empty database volume.
volumes:
  pgdata:
    name: mars_pgdata
  mer_images:
    name: mars_mer_images
  caddy_data:
    name: mars_caddy_data
  caddy_config:
    name: mars_caddy_config
