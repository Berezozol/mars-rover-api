[project]
name = "mars-rover-api"
version = "0.1.0"
description = "Unofficial open-source replacement for the archived NASA Mars Rover Photos API"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "apscheduler>=3.10,<4",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22",
    "ruff>=0.8",
]
tools = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "schemathesis>=4.33.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests without database or network",
    "integration: tests against the test database (upstream mocked)",
    "api: HTTP tests of the public endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
files = ["app"]
python_version = "3.13"
warn_unused_ignores = true
ignore_missing_imports = true
# Report only, not a CI gate yet: `uv run mypy app` shows known findings to burn down.

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
