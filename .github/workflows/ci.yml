name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch / pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  # Same Python as the production image (Dockerfile).
  PYTHON_VERSION: "3.13"
  # Same Node major as the frontend stage of the Dockerfile.
  NODE_VERSION: "26"

jobs:
  checks:
    name: Lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          # Throwaway credentials of this workflow, not project secrets.
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
          POSTGRES_DB: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://mars:mars@localhost:5432/mars
      TEST_DATABASE_URL: postgresql+asyncpg://mars:mars@localhost:5432/mars_test
      SYNC_ENABLED: "false"

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: the token must not stay in .git/config for later steps.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Same script docker-compose mounts into /docker-entrypoint-initdb.d.
      - name: Create test database
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U mars -d mars
          < docker/postgres/init/01-create-test-db.sql

      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head

      - name: Models match migrations (no drift)
        run: uv run alembic check

      # xdist: each worker clones a template database (CREATE DATABASE ... TEMPLATE), which the
      # `mars` role may do as the superuser of the service container.
      - name: Tests
        run: uv run pytest -q -n 4

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: the token must not stay in .git/config for later steps.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes: the token must not stay in .git/config for later steps.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mars-rover-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (app imports as the image user)
        run: docker run --rm mars-rover-api:ci python -c "import app.main"

      - name: Smoke test (built frontend is in the image)
        run: docker run --rm mars-rover-api:ci test -f /app/frontend/dist/index.html
