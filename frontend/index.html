<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Unofficial browser for raw images from the Mars rovers, sol by sol."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Sol Index — Mars rover raw images</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Feed discovery: relative hrefs are resolved against the page address by readers. -->
    <link
      rel="alternate"
      data-static-feed="perseverance"
      type="application/rss+xml"
      title="Perseverance — new raw images (Sol Index)"
      href="/api/v2/rovers/perseverance/feed.xml"
    />
    <link
      rel="alternate"
      data-static-feed="curiosity"
      type="application/rss+xml"
      title="Curiosity — new raw images (Sol Index)"
      href="/api/v2/rovers/curiosity/feed.xml"
    />
    <script>
      // Apply the saved theme before first paint (avoids a flash). Storage may be unavailable.
      try {
        var t = localStorage.getItem("sol-index-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
